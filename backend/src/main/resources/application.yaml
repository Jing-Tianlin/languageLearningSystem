spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/languagelearningsystem?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd
    time-zone: GMT+8
  # 启用虚拟线程：AI 等阻塞式调用不再占用平台线程，提升并发吞吐
  threads:
    virtual:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.cupk.pojo

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}

jwt:
  # 密钥必须通过环境变量注入（至少 32 字节），未配置时应用启动失败
  secret: ${JWT_SECRET:}

# AI 调用配额与限流（进程内实现，单实例适用；多实例请换 Redis）
ai:
  quota:
    enabled: true
    per-minute: 10
    daily: 100
  # AI 结果缓存：相同 prompt 短期内直接复用，降低 API 成本
  cache:
    enabled: true
    ttl-minutes: 10
    max-entries: 500

# 登录防爆破：连续失败达到阈值后锁定
login:
  attempt:
    max: 5
    lock-minutes: 15

# 监控端点：仅暴露 health/info
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
